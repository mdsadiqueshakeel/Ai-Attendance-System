server:
  port: 8080

spring:
  datasource:
    # Supabase uses SSL; include sslmode=require in your JDBC URL.
    # Example:
    # jdbc:postgresql://db.xyljztuoplzrrwdizjxh.supabase.co:5432/postgres?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        boot:
          # Avoid extra metadata calls on startup; dialect is configured explicitly above.
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Use a long random secret in production, passed via env var.
    # Default is intentionally long enough to boot locally without env vars.
    secret: ${JWT_SECRET:dev-change-me-please-change-me-32-chars-min}
    issuer: smart-attendance
    access-token-ttl-minutes: 60
  upload:
    dir: ${UPLOAD_DIR:uploads}
